<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Could Start Over - Out 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #7A7971;
            color: white;
        }

        /* Header - hidden on desktop, visible on mobile */
        .header {
            display: none;
        }

        .header-badge {
            font-size: 48px;
            font-weight: 300;
            color: #81C8B5;
            letter-spacing: 1px;
        }

        .gallery-container {
            height: calc(100vh - 150px);
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            scroll-behavior: smooth;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
        }

        /* Hide scrollbar but keep functionality */
        .gallery-container::-webkit-scrollbar {
            height: 0;
            display: none;
        }

        .gallery-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .gallery {
            display: flex;
            align-items: flex-start;
            padding: 0 20px;
            gap: 3px;
            height: 100%;
        }

        .image-wrapper {
            flex-shrink: 0;
            height: 100%;
            aspect-ratio: 3 / 4;
            scroll-snap-align: center;
            position: relative;
            background-color: #3a3a3a;
            overflow: hidden;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .image-wrapper img.loaded {
            opacity: 1;
        }

        .image-wrapper {
            cursor: pointer;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        .lightbox-content {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .lightbox.active .lightbox-content {
            transform: scale(1);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .lightbox-close:hover {
            opacity: 1;
        }

        .lightbox-close::before,
        .lightbox-close::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 2px;
            background-color: white;
        }

        .lightbox-close::before {
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .lightbox-close::after {
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 20px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .lightbox-nav:hover {
            opacity: 1;
        }

        .lightbox-prev {
            left: 10px;
        }

        .lightbox-next {
            right: 10px;
        }

        .lightbox-nav::before {
            content: '';
            display: block;
            width: 20px;
            height: 20px;
            border-left: 2px solid white;
            border-bottom: 2px solid white;
        }

        .lightbox-prev::before {
            transform: rotate(45deg);
        }

        .lightbox-next::before {
            transform: rotate(-135deg);
        }

        .lightbox-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        /* Grid Toggle Button */
        .view-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 28px;
            height: 28px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .view-toggle:hover {
            opacity: 0.7;
        }

        .view-toggle-icon {
            display: grid;
            grid-template-columns: repeat(3, 4px);
            gap: 2px;
        }

        .view-toggle-icon span {
            width: 4px;
            height: 4px;
            background-color: white;
            border-radius: 1px;
            opacity: 0.8;
        }

        /* Scroll icon (shown in grid mode) */
        .view-toggle.grid-active .view-toggle-icon {
            display: flex;
            gap: 2px;
        }

        .view-toggle.grid-active .view-toggle-icon span {
            width: 3px;
            height: 12px;
            border-radius: 1px;
        }

        /* Grid View Styles */
        body.grid-mode {
            overflow: auto;
        }

        body.grid-mode .gallery-container {
            display: block;
            height: auto;
            overflow: visible;
            padding-bottom: 100px;
        }

        body.grid-mode .gallery {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 8px;
            padding: 20px;
            height: auto;
        }

        body.grid-mode .image-wrapper {
            flex: 0 0 calc(14.285% - 7px);
            height: 0;
            padding-bottom: calc((14.285% - 7px) * 4 / 3);
            position: relative;
            aspect-ratio: unset;
        }

        body.grid-mode .image-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-wrapper.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            margin: -15px 0 0 -15px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            height: 90px;
            background-color: #7A7971;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position:fixed;
            bottom:0;
            right:0;
            left:0;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            position:fixed;
            left:20px;
        }

        .footer-title {
            font-size: 24px;
            font-weight: 400;
            color: #81C8B5;
            letter-spacing: 0.5px;
        }

        .footer-links {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 11px;
            color: rgba(255,255,255,0.6);
        }

        .footer-links a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: white;
        }

        .footer-right {
            display: flex;
            align-items: center;
            position:fixed;
           
            right:20px;
        }

        .issue-badge {
            font-size: 36px;
            font-weight: 300;
            color: #81C8B5;
            letter-spacing: 1px;
        }

        /* Mobile styles */
        @media (max-width: 768px) {
            .header {
                display: flex;
                justify-content: flex-end;
                align-items: center;
                padding: 30px 20px;
                height: 120px;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                background-color: #7A7971;
                z-index: 10;
            }

            .gallery-container {
                height: calc(100vh - 120px - 120px);
                margin-top: 120px;
                margin-bottom: 120px;
            }

            .gallery {
                padding: 0 20px;
                gap: 15px;
            }

            .image-wrapper {
                height: 100%;
            }

            .footer {
                height: 120px;
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
                gap: 8px;
                padding: 20px;
                position: fixed;
                bottom: 0;
                right: 0;
                left: 0;
            }

            .footer-left {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
                position: static;
            }

            .footer-title {
                font-size: 24px;
            }

            .footer-links {
                gap: 20px;
                font-size: 12px;
            }

            .footer-right {
                display: none;
            }

            .view-toggle {
                top: 46px;
                bottom: auto;
                left: 20px;
                right: auto;
            }

            body.grid-mode .gallery-container {
                margin-top: 120px;
                padding-bottom: 130px;
            }

            body.grid-mode .image-wrapper {
                flex: 0 0 calc(25% - 6px);
                padding-bottom: calc((25% - 6px) * 4 / 3);
            }
        }
    </style>
</head>
<body>
    <!-- View Toggle Button -->
    <button class="view-toggle" id="viewToggle" aria-label="Toggle grid view">
        <div class="view-toggle-icon">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>
    </button>

    <header class="header">
        <span class="header-badge">Out 1</span>
    </header>

    <div class="gallery-container" id="galleryContainer">
        <div class="gallery" id="gallery">
            <!-- Images will be dynamically inserted here -->
        </div>
    </div>

    <footer class="footer">
        <div class="footer-left">
            <span class="footer-title">We Could Start Over</span>
            <div class="footer-links">
                <a href="https://drive.google.com/drive/folders/1UkzxeAqmP_IUxoQNtaTU5_7jmgrGttrt?usp=sharing" target="_blank">Download</a>
                <a href="https://timmoore.xyz" target="_blank">By Tim Moore, 2025</a>
            </div>
        </div>
        <div class="footer-right">
            <span class="issue-badge">Out 1</span>
        </div>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close"></button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous"></button>
        <img class="lightbox-content" id="lightboxImage" src="" alt="">
        <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next"></button>
        <div class="lightbox-counter" id="lightboxCounter"></div>
    </div>

    <script>
        const TOTAL_IMAGES = 62;
        const IMAGE_PATH = 'web images/Out1-WeCouldStartOver_';
        const LOAD_AHEAD = 3;      // Load this many images ahead of viewport
        const UNLOAD_BEHIND = 5;   // Unload images this far behind viewport

        // Track loaded images
        const loadedImages = new Set();
        const imageElements = new Map();

        // Create gallery structure
        function initGallery() {
            const gallery = document.getElementById('gallery');

            for (let i = 1; i <= TOTAL_IMAGES; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'image-wrapper';
                wrapper.dataset.index = i;

                const img = document.createElement('img');
                img.alt = `We Could Start Over - Image ${i}`;
                img.dataset.src = `${IMAGE_PATH}${String(i).padStart(2, '0')}.jpg`;

                wrapper.appendChild(img);
                gallery.appendChild(wrapper);
                imageElements.set(i, { wrapper, img });
            }
        }

        // Load a single image
        function loadImage(index) {
            if (loadedImages.has(index) || index < 1 || index > TOTAL_IMAGES) return;

            const { wrapper, img } = imageElements.get(index);
            wrapper.classList.add('loading');

            const tempImg = new Image();
            tempImg.onload = () => {
                img.src = img.dataset.src;
                img.classList.add('loaded');
                wrapper.classList.remove('loading');
                loadedImages.add(index);
            };
            tempImg.onerror = () => {
                wrapper.classList.remove('loading');
            };
            tempImg.src = img.dataset.src;
        }

        // Unload an image to free memory
        function unloadImage(index) {
            if (!loadedImages.has(index)) return;

            const { wrapper, img } = imageElements.get(index);
            img.classList.remove('loaded');
            img.src = '';
            loadedImages.delete(index);
        }

        // Get currently visible image index based on scroll position
        function getVisibleIndex() {
            const container = document.getElementById('galleryContainer');
            const scrollLeft = container.scrollLeft;
            const wrappers = document.querySelectorAll('.image-wrapper');

            if (wrappers.length === 0) return 1;

            // Find the image closest to center of viewport
            const containerWidth = container.clientWidth;
            const viewportCenter = scrollLeft + (containerWidth / 2);

            let closestIndex = 1;
            let closestDistance = Infinity;

            wrappers.forEach((wrapper, i) => {
                const wrapperCenter = wrapper.offsetLeft + (wrapper.offsetWidth / 2);
                const distance = Math.abs(viewportCenter - wrapperCenter);

                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestIndex = i + 1;
                }
            });

            return closestIndex;
        }

        // Update which images are loaded based on scroll position
        function updateLoadedImages() {
            // Don't unload images in grid mode
            if (isGridView) return;

            const currentIndex = getVisibleIndex();

            // Load images around current position
            for (let i = currentIndex - LOAD_AHEAD; i <= currentIndex + LOAD_AHEAD; i++) {
                loadImage(i);
            }

            // Unload images far from current position
            loadedImages.forEach(index => {
                if (index < currentIndex - UNLOAD_BEHIND || index > currentIndex + UNLOAD_BEHIND) {
                    unloadImage(index);
                }
            });
        }

        // Throttle function for scroll events
        function throttle(func, limit) {
            let inThrottle;
            return function(...args) {
                if (!inThrottle) {
                    func.apply(this, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            };
        }

        // Lightbox functionality
        let currentLightboxIndex = 1;
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxCounter = document.getElementById('lightboxCounter');

        function openLightbox(index) {
            currentLightboxIndex = index;
            const imageSrc = `${IMAGE_PATH}${String(index).padStart(2, '0')}.jpg`;
            lightboxImage.src = imageSrc;
            lightboxCounter.textContent = `${index} / ${TOTAL_IMAGES}`;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            let newIndex = currentLightboxIndex + direction;
            if (newIndex < 1) newIndex = TOTAL_IMAGES;
            if (newIndex > TOTAL_IMAGES) newIndex = 1;
            openLightbox(newIndex);
        }

        // Grid view functionality
        let isGridView = false;

        function toggleGridView() {
            const toggle = document.getElementById('viewToggle');

            isGridView = !isGridView;

            if (isGridView) {
                document.body.classList.add('grid-mode');
                toggle.classList.add('grid-active');
                // Load all images in grid view
                for (let i = 1; i <= TOTAL_IMAGES; i++) {
                    loadImage(i);
                }
            } else {
                document.body.classList.remove('grid-mode');
                toggle.classList.remove('grid-active');
                // Reset to lazy loading
                updateLoadedImages();
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initGallery();

            // Initial load
            updateLoadedImages();

            // Handle scroll
            const container = document.getElementById('galleryContainer');
            container.addEventListener('scroll', throttle(updateLoadedImages, 100));

            // Handle resize
            window.addEventListener('resize', throttle(updateLoadedImages, 200));

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                const container = document.getElementById('galleryContainer');
                const wrappers = document.querySelectorAll('.image-wrapper');
                const currentIndex = getVisibleIndex();

                if (e.key === 'ArrowRight' && currentIndex < TOTAL_IMAGES) {
                    const target = wrappers[currentIndex];
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', inline: 'center' });
                    }
                } else if (e.key === 'ArrowLeft' && currentIndex > 1) {
                    const target = wrappers[currentIndex - 2];
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', inline: 'center' });
                    }
                }
            });

            // Touch/mouse wheel horizontal scroll enhancement (only in scroll mode)
            container.addEventListener('wheel', (e) => {
                if (isGridView) return; // Let normal scrolling work in grid mode
                if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                    e.preventDefault();
                    container.scrollLeft += e.deltaY;
                }
            }, { passive: false });

            // Lightbox event listeners
            document.getElementById('gallery').addEventListener('click', (e) => {
                const wrapper = e.target.closest('.image-wrapper');
                if (wrapper) {
                    const index = parseInt(wrapper.dataset.index);
                    openLightbox(index);
                }
            });

            document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
            document.getElementById('lightboxPrev').addEventListener('click', () => navigateLightbox(-1));
            document.getElementById('lightboxNext').addEventListener('click', () => navigateLightbox(1));

            // Grid toggle
            document.getElementById('viewToggle').addEventListener('click', toggleGridView);

            // Close on background click
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });

            // Keyboard navigation for lightbox
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;

                if (e.key === 'Escape') {
                    closeLightbox();
                } else if (e.key === 'ArrowLeft') {
                    navigateLightbox(-1);
                } else if (e.key === 'ArrowRight') {
                    navigateLightbox(1);
                }
            });
        });
    </script>
</body>
</html>
