<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Could Start Over - Out 1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-mode">
    <!-- View Toggle Button -->
    <button class="view-toggle" id="viewToggle" aria-label="Toggle grid view">
        <div class="view-toggle-icon">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>
    </button>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <span class="theme-circle light"></span>
        <span class="theme-circle dark active"></span>
    </button>

    <!-- Back to Start Button -->
    <button class="back-to-start" id="backToStart" aria-label="Back to start">Start over</button>

    <!-- Auto Scroll Toggle -->
    <button class="auto-scroll-toggle" id="autoScrollToggle" aria-label="Toggle auto scroll">Auto</button>

    <header class="header">
        <span class="header-badge">Out 1</span>
    </header>

    <div class="gallery-container" id="galleryContainer">
        <div class="gallery" id="gallery">
            <!-- Images will be dynamically inserted here -->
        </div>
    </div>

    <footer class="footer">
        <div class="footer-left">
            <span class="footer-title">We Could Start Over</span>
            <div class="footer-links">
                 <a class="credit" href="https://timmoore.xyz" target="_blank">By Tim Moore, 2025</a>
                <a class="download" href="https://drive.google.com/drive/folders/1UkzxeAqmP_IUxoQNtaTU5_7jmgrGttrt?usp=sharing" target="_blank">Download</a>
                <a class="github" href="https://github.com/prvctice/wecouldstartover" target="_blank">GitHub</a>
            </div>
        </div>
        <div class="footer-right">
            <div class="world-clock-container">
                <span class="issue-badge" id="issueBadge">Out 1</span>
                <div class="world-clock" id="worldClock">
                    <div class="clock-time" id="clockTime">12:00 PM</div>
                    <div class="clock-city-row">
                        <button class="clock-arrow clock-prev" id="clockPrev" aria-label="Previous city">←</button>
                        <span class="clock-city" id="clockCity">New York</span>
                        <button class="clock-arrow clock-next" id="clockNext" aria-label="Next city">→</button>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close"></button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Previous"></button>
        <img class="lightbox-content" id="lightboxImage" src="" alt="">
        <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Next"></button>
    </div>

    <script>
        const TOTAL_IMAGES = 62;
        const IMAGE_PATH = 'web images/Out1-WeCouldStartOver_';
        const LOAD_AHEAD = 3;      // Load this many images ahead of viewport
        const UNLOAD_BEHIND = 5;   // Unload images this far behind viewport

        // Track loaded images
        const loadedImages = new Set();
        const imageElements = new Map();

        // Create gallery structure
        function initGallery() {
            const gallery = document.getElementById('gallery');

            for (let i = 1; i <= TOTAL_IMAGES; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'image-wrapper';
                wrapper.dataset.index = i;

                const img = document.createElement('img');
                img.alt = `We Could Start Over - Image ${i}`;
                img.dataset.src = `${IMAGE_PATH}${String(i).padStart(2, '0')}.jpg`;

                wrapper.appendChild(img);
                gallery.appendChild(wrapper);
                imageElements.set(i, { wrapper, img });
            }
        }

        // Load a single image
        function loadImage(index) {
            if (loadedImages.has(index) || index < 1 || index > TOTAL_IMAGES) return;

            const { wrapper, img } = imageElements.get(index);
            wrapper.classList.add('loading');

            const tempImg = new Image();
            tempImg.onload = () => {
                img.src = img.dataset.src;
                img.classList.add('loaded');
                wrapper.classList.remove('loading');
                loadedImages.add(index);
            };
            tempImg.onerror = () => {
                wrapper.classList.remove('loading');
            };
            tempImg.src = img.dataset.src;
        }

        // Unload an image to free memory
        function unloadImage(index) {
            if (!loadedImages.has(index)) return;

            const { wrapper, img } = imageElements.get(index);
            img.classList.remove('loaded');
            img.src = '';
            loadedImages.delete(index);
        }

        // Get currently visible image index based on scroll position
        function getVisibleIndex() {
            const container = document.getElementById('galleryContainer');
            const scrollLeft = container.scrollLeft;
            const wrappers = document.querySelectorAll('.image-wrapper');

            if (wrappers.length === 0) return 1;

            // Find the image closest to center of viewport
            const containerWidth = container.clientWidth;
            const viewportCenter = scrollLeft + (containerWidth / 2);

            let closestIndex = 1;
            let closestDistance = Infinity;

            wrappers.forEach((wrapper, i) => {
                const wrapperCenter = wrapper.offsetLeft + (wrapper.offsetWidth / 2);
                const distance = Math.abs(viewportCenter - wrapperCenter);

                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestIndex = i + 1;
                }
            });

            return closestIndex;
        }

        // Update which images are loaded based on scroll position
        function updateLoadedImages() {
            // Don't unload images in grid mode
            if (isGridView) return;

            const currentIndex = getVisibleIndex();

            // Load images around current position
            for (let i = currentIndex - LOAD_AHEAD; i <= currentIndex + LOAD_AHEAD; i++) {
                loadImage(i);
            }

            // Unload images far from current position
            loadedImages.forEach(index => {
                if (index < currentIndex - UNLOAD_BEHIND || index > currentIndex + UNLOAD_BEHIND) {
                    unloadImage(index);
                }
            });
        }

        // Throttle function for scroll events
        function throttle(func, limit) {
            let inThrottle;
            return function(...args) {
                if (!inThrottle) {
                    func.apply(this, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            };
        }

        // Lightbox functionality
        let currentLightboxIndex = 1;
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');

        function openLightbox(index) {
            currentLightboxIndex = index;
            const imageSrc = `${IMAGE_PATH}${String(index).padStart(2, '0')}.jpg`;
            lightboxImage.src = imageSrc;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(direction) {
            let newIndex = currentLightboxIndex + direction;
            if (newIndex < 1) newIndex = TOTAL_IMAGES;
            if (newIndex > TOTAL_IMAGES) newIndex = 1;
            openLightbox(newIndex);
        }

        // Grid view functionality
        let isGridView = false;

        function toggleGridView() {
            const toggle = document.getElementById('viewToggle');
            const backBtn = document.getElementById('backToStart');

            isGridView = !isGridView;

            if (isGridView) {
                document.body.classList.add('grid-mode');
                toggle.classList.add('grid-active');
                backBtn.classList.remove('visible');
                // Load all images in grid view
                for (let i = 1; i <= TOTAL_IMAGES; i++) {
                    loadImage(i);
                }
            } else {
                document.body.classList.remove('grid-mode');
                toggle.classList.remove('grid-active');
                // Reset to lazy loading
                updateLoadedImages();
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initGallery();

            // Initial load
            updateLoadedImages();

            // Handle scroll
            const container = document.getElementById('galleryContainer');
            container.addEventListener('scroll', throttle(updateLoadedImages, 100));

            // Back to start button visibility
            const backToStart = document.getElementById('backToStart');
            const SCROLL_THRESHOLD = 200;

            function updateBackButtonVisibility() {
                if (isGridView) return;
                if (container.scrollLeft > SCROLL_THRESHOLD) {
                    backToStart.classList.add('visible');
                } else {
                    backToStart.classList.remove('visible');
                }
            }

            container.addEventListener('scroll', throttle(updateBackButtonVisibility, 100));

            // Back to start click handler
            backToStart.addEventListener('click', () => {
                stopAutoScroll();
                container.scrollTo({ left: 0, behavior: 'smooth' });
            });

            // Handle resize
            window.addEventListener('resize', throttle(updateLoadedImages, 200));

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                const container = document.getElementById('galleryContainer');
                const wrappers = document.querySelectorAll('.image-wrapper');
                const currentIndex = getVisibleIndex();

                if (e.key === 'ArrowRight' && currentIndex < TOTAL_IMAGES) {
                    const target = wrappers[currentIndex];
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', inline: 'center' });
                    }
                } else if (e.key === 'ArrowLeft' && currentIndex > 1) {
                    const target = wrappers[currentIndex - 2];
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', inline: 'center' });
                    }
                }
            });

            // Touch/mouse wheel horizontal scroll enhancement (only in scroll mode)
            container.addEventListener('wheel', (e) => {
                if (isGridView) return; // Let normal scrolling work in grid mode
                if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
                    e.preventDefault();
                    container.scrollLeft += e.deltaY;
                }
            }, { passive: false });

            // Lightbox event listeners
            document.getElementById('gallery').addEventListener('click', (e) => {
                const wrapper = e.target.closest('.image-wrapper');
                if (wrapper) {
                    const index = parseInt(wrapper.dataset.index);
                    openLightbox(index);
                }
            });

            document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
            document.getElementById('lightboxPrev').addEventListener('click', () => navigateLightbox(-1));
            document.getElementById('lightboxNext').addEventListener('click', () => navigateLightbox(1));

            // Grid toggle
            document.getElementById('viewToggle').addEventListener('click', toggleGridView);

            // Theme toggle
            document.getElementById('themeToggle').addEventListener('click', () => {
                const isDark = document.body.classList.toggle('dark-mode');
                const lightCircle = document.querySelector('.theme-circle.light');
                const darkCircle = document.querySelector('.theme-circle.dark');

                if (isDark) {
                    lightCircle.classList.remove('active');
                    darkCircle.classList.add('active');
                } else {
                    darkCircle.classList.remove('active');
                    lightCircle.classList.add('active');
                }
            });

            // Close on background click
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });

            // Keyboard navigation for lightbox
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;

                if (e.key === 'Escape') {
                    closeLightbox();
                } else if (e.key === 'ArrowLeft') {
                    navigateLightbox(-1);
                } else if (e.key === 'ArrowRight') {
                    navigateLightbox(1);
                }
            });

            // Apple TV-style hover tilt effect (desktop only)
            if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
                const gallery = document.getElementById('gallery');

                gallery.addEventListener('mousemove', (e) => {
                    const wrapper = e.target.closest('.image-wrapper');
                    if (!wrapper) return;

                    const rect = wrapper.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    // Calculate position as percentage (-0.5 to 0.5)
                    const xPercent = (x / rect.width) - 0.5;
                    const yPercent = (y / rect.height) - 0.5;

                    // Subtle rotation (max ~2 degrees)
                    const rotateY = xPercent * 4;
                    const rotateX = yPercent * -4;

                    wrapper.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.01)`;
                });

                gallery.addEventListener('mouseleave', () => {
                    const wrappers = document.querySelectorAll('.image-wrapper');
                    wrappers.forEach(w => w.style.transform = '');
                });

                // Reset individual wrapper on mouse leave
                gallery.addEventListener('mouseout', (e) => {
                    const wrapper = e.target.closest('.image-wrapper');
                    const relatedWrapper = e.relatedTarget?.closest('.image-wrapper');

                    if (wrapper && wrapper !== relatedWrapper) {
                        wrapper.style.transform = '';
                    }
                });
            }

            // World Clock functionality
            const cities = [
                { name: 'New York', timezone: 'America/New_York' },
                { name: 'Hong Kong', timezone: 'Asia/Hong_Kong' },
                { name: 'Paris', timezone: 'Europe/Paris' },
                { name: 'Tokyo', timezone: 'Asia/Tokyo' },
                { name: 'Taipei City', timezone: 'Asia/Taipei' },
                { name: 'Berlin', timezone: 'Europe/Berlin' },
                { name: 'Beijing', timezone: 'Asia/Shanghai' }
            ];

            let currentCityIndex = 0;
            let clockInterval = null;
            const issueBadge = document.getElementById('issueBadge');
            const worldClock = document.getElementById('worldClock');
            const clockTime = document.getElementById('clockTime');
            const clockCity = document.getElementById('clockCity');
            const clockPrev = document.getElementById('clockPrev');
            const clockNext = document.getElementById('clockNext');

            function formatTime(date, timezone) {
                return date.toLocaleTimeString('en-US', {
                    timeZone: timezone,
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
            }

            function updateClock() {
                const now = new Date();
                const city = cities[currentCityIndex];
                clockTime.textContent = formatTime(now, city.timezone);
                clockCity.textContent = city.name;
            }

            function showClock() {
                worldClock.classList.add('active');
                issueBadge.classList.add('active');
                updateClock();
                clockInterval = setInterval(updateClock, 1000);
            }

            function hideClock() {
                worldClock.classList.remove('active');
                issueBadge.classList.remove('active');
                if (clockInterval) {
                    clearInterval(clockInterval);
                    clockInterval = null;
                }
            }

            function toggleClock() {
                if (worldClock.classList.contains('active')) {
                    hideClock();
                } else {
                    showClock();
                }
            }

            function nextCity() {
                currentCityIndex = (currentCityIndex + 1) % cities.length;
                updateClock();
            }

            function prevCity() {
                currentCityIndex = (currentCityIndex - 1 + cities.length) % cities.length;
                updateClock();
            }

            issueBadge.addEventListener('click', toggleClock);
            clockNext.addEventListener('click', nextCity);
            clockPrev.addEventListener('click', prevCity);

            // Auto Scroll functionality
            let isAutoScrolling = false;
            let autoScrollInterval = null;
            const AUTO_SCROLL_SPEED = 2; // pixels per tick
            const AUTO_SCROLL_INTERVAL = 20; // ms between ticks
            const autoScrollToggle = document.getElementById('autoScrollToggle');

            function startAutoScroll() {
                if (isGridView || isAutoScrolling) return;
                isAutoScrolling = true;
                autoScrollToggle.classList.add('active');

                // Disable scroll-snap during auto-scroll
                container.style.scrollSnapType = 'none';

                autoScrollInterval = setInterval(() => {
                    const maxScroll = container.scrollWidth - container.clientWidth;

                    if (container.scrollLeft >= maxScroll - 5) {
                        container.scrollLeft = 0;
                    } else {
                        container.scrollLeft = container.scrollLeft + AUTO_SCROLL_SPEED;
                    }
                }, AUTO_SCROLL_INTERVAL);
            }

            function stopAutoScroll() {
                isAutoScrolling = false;
                autoScrollToggle.classList.remove('active');
                if (autoScrollInterval) {
                    clearInterval(autoScrollInterval);
                    autoScrollInterval = null;
                }
                // Re-enable scroll-snap
                container.style.scrollSnapType = 'x proximity';
            }

            function toggleAutoScroll() {
                if (isGridView) return;
                if (isAutoScrolling) {
                    stopAutoScroll();
                } else {
                    startAutoScroll();
                }
            }

            autoScrollToggle.addEventListener('click', toggleAutoScroll);

            // Pause auto scroll on user interaction
            container.addEventListener('mousedown', stopAutoScroll);
            container.addEventListener('touchstart', stopAutoScroll);
            container.addEventListener('wheel', () => {
                if (isAutoScrolling) stopAutoScroll();
            }, { passive: true });

            // Stop auto scroll when entering grid mode
            const originalToggleGridView = toggleGridView;
            toggleGridView = function() {
                stopAutoScroll();
                originalToggleGridView();
            };
            document.getElementById('viewToggle').removeEventListener('click', originalToggleGridView);
            document.getElementById('viewToggle').addEventListener('click', toggleGridView);
        });
    </script>
</body>
</html>
